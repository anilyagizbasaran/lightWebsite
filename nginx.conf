server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    charset_types text/css application/javascript image/svg+xml;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript image/svg+xml application/json;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Gelistirme sirasinda cache kapali: dosyayi kaydet, sayfayi yenile, degisiklik gelsin.
    # Yayina alirken bunu "public, max-age=86400" yapip dosya adlarina surum ekle.
    location /assets/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
