# Yayin ayari (Dockerfile bunu kopyalar). Gelistirme icin nginx.conf kullanilir.
#
# CSS, JS ve sahne resmi kur.py tarafindan ?v=<surum> ile yaziliyor. Surum degisince
# adres de degisir, bu yuzden surumlu istekler 1 yil boyunca yeniden indirilmez.
# Surumsuz bir istek gelirse (elle yazilmis bir yol) kisa sure tutulur.
map $arg_v $varlik_onbellek {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    charset_types text/css application/javascript image/svg+xml;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript image/svg+xml application/json;

    # Sayfanin kendisi her zaman tazelenir; yeni surum numaralari buradan gelir.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control $varlik_onbellek;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
